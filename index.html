<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feel Taiwan — Unfold Taiwan board</title>
<style>
/* ── the only two faces. Both local; no Google Fonts, no third family. ── */
@font-face{font-family:'Taiwan Sans';
  src:url('fonts/taiwan-sans.woff2') format('woff2'),
      url('fonts/taiwan-sans.woff') format('woff');
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Montserrat';
  src:url('fonts/montserrat.woff2') format('woff2');
  font-weight:100 900;font-style:normal;font-display:swap}

:root{
  --paper:#F7F4EF;--card:#FFFFFF;--ink:#372E22;--body:#4C4234;--mid:#6B5D4A;
  --light:#9A8B74;--border:#DFD3BA;--border-l:#EAE0CB;--orange:#FF5629;
  --gold:#E5863B;--mango:#FFCA03;--grass:#007758;--moss:#004740;--purple:#8146C6;
  --summer:#269AF9;--trunk:#814724;
  --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --disp:'Taiwan Sans','Montserrat',var(--font);
  --tile:clamp(128px,15vw,206px);--gap:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
/* Taiwan Sans ships ONE weight (400). Anything asking for 700 makes the
   browser synthesise bold, which thickens the strokes and stops it looking
   like Taiwan Sans. Every element on the display face asks for 400. */
h1,h2,h3,h4,b,strong,.logo,.tile h3,.tile .num,.tile .flag,.lines b,
.layer-hd h2,.sub-i .st,.roll,.roll-again,.sechd h2,.sechd .sub,
.offer .no,.offer h3,.offer .tag,.card .n,.card h3,.card .tag,
.win h2,.row .n,.anno b,.pane h1{font-weight:400}
/* The embedding element sets a fixed height. Fill it exactly — that is what
   removes the blank band — and never scroll inside the iframe. */
html,body{margin:0}
body{background:var(--paper);color:var(--body);font-family:var(--font);
  -webkit-font-smoothing:antialiased}
.board-sec{width:100%}
.wrap{max-width:1300px;margin:0 auto;padding:0 20px}

.hdr{border-bottom:1px solid var(--border);background:var(--paper);position:sticky;top:0;z-index:30}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:16px}
.logo{font-family:var(--disp);font-size:19px;letter-spacing:.12em;color:var(--orange);text-transform:uppercase;white-space:nowrap}
.nav{display:flex;gap:5px;flex-wrap:wrap}
.nav a{font-family:var(--font);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);text-decoration:none;border:1px solid var(--border);padding:6px 10px;border-radius:2px;white-space:nowrap}
.nav a:hover{color:var(--orange);border-color:var(--orange)}

.board-sec{padding:10px 0}
.board{position:relative;display:grid;gap:var(--gap);
  grid-template-columns:var(--tile) 1fr 1fr var(--tile);
  grid-template-rows:var(--tile) minmax(190px,auto) minmax(190px,auto) var(--tile)}
.centre{grid-area:2/2/4/4}
.p1{grid-area:1/1}.p2{grid-area:1/2}.p3{grid-area:1/3}.p4{grid-area:1/4}
.p5{grid-area:2/4}.p6{grid-area:3/4}.p7{grid-area:4/4}.p8{grid-area:4/3}
.p9{grid-area:4/2}.p10{grid-area:4/1}.p11{grid-area:3/1}.p12{grid-area:2/1}

.tile{position:relative;overflow:hidden;border-radius:10px;background:var(--hue,var(--grass));
  display:flex;flex-direction:column;justify-content:flex-end;min-height:0;isolation:isolate;
  border:none;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit;
  transition:transform .14s cubic-bezier(.2,.9,.25,1)}
.tile:hover{transform:translateY(-3px)}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* ── colour code: a sliver across the top of every square ──
   green  = the six 100 Ways themes
   orange = promos and prizes
   mango  = What's On
   Set per square from its `kind` — see accentFor() below. */
.tile .bar{position:absolute;top:0;left:0;right:0;height:6px;z-index:3;
  background:var(--accent,var(--grass))}
.tile{--accent:var(--grass)}
.tile.k-promo{--accent:var(--orange)}
.tile.k-ways{--accent:var(--grass)}
.tile.k-now{--accent:var(--mango)}
.tile.k-start{--accent:var(--ink)}
.tile .cap{padding-top:13px}
.tile .ph{position:absolute;inset:0;z-index:-2;
  background:radial-gradient(120% 90% at 30% 22%,rgba(255,255,255,.30),transparent 62%),
             linear-gradient(160deg,var(--hue) 0%,color-mix(in srgb,var(--hue) 62%,#000) 100%)}
.tile .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:50% 38%;z-index:-2}
.tile .scrim{position:absolute;left:0;right:0;bottom:0;height:56%;z-index:-1;
  background:linear-gradient(to top,rgba(20,14,8,.80) 0%,rgba(20,14,8,.42) 46%,transparent 100%)}
.tile .cap{display:block;padding:10px 11px}
.tile .kind{display:block;font-family:var(--font);font-weight:600;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:3px}
.tile h3{font-family:var(--disp);font-size:16px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;color:#fff}
.tile .sub{display:block;font-family:var(--font);font-size:10px;line-height:1.35;color:rgba(255,255,255,.82);margin-top:3px}
.tile .num{position:absolute;top:7px;left:8px;font-family:var(--disp);font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.6)}
.tile .flag{position:absolute;top:6px;right:7px;background:var(--mango);color:var(--ink);font-family:var(--disp);font-size:9px;letter-spacing:.05em;padding:3px 6px;border-radius:2px}
.tile .layers{position:absolute;right:8px;bottom:8px;display:flex;gap:2px}
.tile .layers i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85)}
.tile[aria-expanded="true"]{transform:translateY(-3px);box-shadow:0 0 0 3px var(--ink)}

/* ── carrier tiles: white partner panel, logo optically normalised ── */
.tile.air{background:#fff;justify-content:center;align-items:center;padding:14px 16px}
.tile.air .ph,.tile.air .scrim{display:none}
.tile.air img{width:100%;max-width:190px;height:auto;display:block}
.tile.air .cond{position:absolute;left:0;right:0;bottom:0;padding:8px 11px;
  font-family:var(--font);font-weight:600;font-size:9.5px;letter-spacing:.04em;
  color:var(--mid);border-top:1px solid var(--border-l);background:#fff;text-align:center}
.tile.air .num{color:var(--light)}
.tile.air .layers i{background:rgba(55,46,34,.35)}
/* ── START: solid orange, the plane mark, no logos on the face.
   The carriers live in the card that opens. ── */
.tile.start{background:var(--orange);justify-content:center;align-items:center;
  padding:14px 12px;text-align:center;gap:6px}
.tile.start .ph,.tile.start .scrim,.tile.start .layers{display:none}
.tile.start .cap{padding:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.tile.start .kind{display:none}
.tile.start .big{font-family:var(--disp);font-size:clamp(20px,2.4vw,34px);line-height:.95;
  color:#fff;letter-spacing:.01em}
.tile.start .plane{width:62%;max-width:120px;height:auto;display:block;margin:2px 0 1px}
.tile.start h3{font-size:13px;color:#fff;letter-spacing:.06em}
.tile.start .sub{display:none}
.subs.g3{grid-template-columns:1fr 1fr 1fr}
.sub-i .mk{background:#fff;border-radius:2px;padding:10px 12px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:center;min-height:58px}
.sub-i .mk img{max-width:100%;max-height:46px;object-fit:contain}

.centre{background:var(--card);border:1px solid var(--border);border-radius:10px;
  display:grid;overflow:hidden;min-height:0}
.pane{grid-area:1/1;min-height:0;padding:22px 24px;
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);
  align-items:center;gap:18px;text-align:left}
/* ── stage: the bear standing on the island, dice in the air ──
   Fixed height so the artwork sizes to the panel instead of the
   panel growing to the artwork. */
.stage{position:relative;height:clamp(200px,21vw,290px);width:100%;min-height:0}
.stage .map{position:absolute;left:0;bottom:0;height:76%;width:auto;
  color:var(--grass);opacity:.22;pointer-events:none}
.stage .bear{position:absolute;left:39%;bottom:0;height:74%;width:auto;
  object-fit:contain;filter:drop-shadow(0 8px 14px rgba(28,20,10,.22))}
/* Two dice, thrown separately. One image tumbling as a block never
   reads as a roll — real dice separate, spin at different rates and
   settle at different moments. Each also bounces twice and wobbles. */
.dice{position:absolute;top:2%;right:0;width:22%;height:40%;pointer-events:none}
.cube{position:absolute;width:52%;height:auto;transform-origin:50% 50%;
  filter:drop-shadow(0 4px 7px rgba(28,20,10,.26));will-change:transform}
.cube.a{left:0;bottom:0}
.cube.b{right:0;top:0;width:48%}
.dice.tumble .cube.a{animation:throwA 1.55s cubic-bezier(.16,.72,.24,1) both}
.dice.tumble .cube.b{animation:throwB 1.72s cubic-bezier(.13,.76,.28,1) both}
@keyframes throwA{
  0%  {transform:translate(0,0)        rotate(0deg)   scale(1)}
  14% {transform:translate(-14%,-140%) rotate(240deg) scale(1.12)}
  30% {transform:translate(-6%,-4%)    rotate(470deg) scale(.97)}   /* land */
  42% {transform:translate(6%,-62%)    rotate(610deg) scale(1.05)}  /* bounce */
  56% {transform:translate(14%,-2%)    rotate(700deg) scale(.98)}
  68% {transform:translate(18%,-22%)   rotate(752deg) scale(1.01)}
  82% {transform:translate(21%,0)      rotate(784deg) scale(1)}
  90% {transform:translate(21%,-4%)    rotate(790deg)}
  100%{transform:translate(21%,0)      rotate(792deg)}
}
@keyframes throwB{
  0%  {transform:translate(0,0)        rotate(0deg)    scale(1)}
  12% {transform:translate(16%,-118%)  rotate(-200deg) scale(1.1)}
  28% {transform:translate(9%,-6%)     rotate(-390deg) scale(.96)}
  40% {transform:translate(2%,-78%)    rotate(-540deg) scale(1.06)}
  55% {transform:translate(-6%,-3%)    rotate(-650deg) scale(.98)}
  70% {transform:translate(-11%,-26%)  rotate(-722deg) scale(1.02)}
  84% {transform:translate(-15%,0)     rotate(-766deg) scale(1)}
  93% {transform:translate(-15%,-5%)   rotate(-772deg)}
  100%{transform:translate(-15%,0)     rotate(-774deg)}
}
.words{display:flex;flex-direction:column;gap:9px;min-width:0}
/* hidden beats every display rule below, including .pane.layer's grid */
.pane[hidden]{display:none!important}
.kick{font-family:var(--font);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--light)}
.pane h1{font-family:var(--disp);font-size:clamp(30px,3.9vw,54px);line-height:.94;text-transform:uppercase;color:var(--ink)}
.pane h1 em{font-style:normal;color:var(--orange)}
.lede{font-family:var(--font);font-size:13.5px;line-height:1.5;letter-spacing:.01em;color:var(--mid);max-width:34ch}
.lines{display:flex;flex-direction:column;gap:4px}
.lines b{font-family:var(--disp);font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);font-weight:400}

/* .pane.layer, not .layer: the card borrows the centre panel's class,
   and a .pane rule between 861-1180px would otherwise force two columns */
.pane.layer{grid-area:2/2/4/4;z-index:10;background:var(--card);border:1px solid var(--border);
  border-radius:10px;text-align:left;padding:0;gap:0;overflow:hidden;
  display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;align-items:stretch}

/* ── the manifesto card ───────────────────────────────────
   One voice, then three pictures. The paragraph leads; the pictures
   sit at the foot so every card ends on the same beat.        */
.man-wrap{min-height:0;overflow:auto;padding:14px 18px 16px;
  display:flex;flex-direction:column;gap:11px}
.man-lead{font-family:var(--disp);font-weight:400;font-size:clamp(15px,1.45vw,20px);
  line-height:1.12;text-transform:uppercase;color:var(--ink)}
.man{font-family:var(--font);font-size:13px;line-height:1.58;color:var(--mid);max-width:62ch}
.man-cta{font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:.04em;
  color:var(--orange);text-decoration:none;align-self:flex-start;
  border-bottom:1px solid currentColor;padding-bottom:1px}
.man-cta:hover{color:var(--ink)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:auto;padding-top:2px}
.gal figure{margin:0;min-width:0}
.gal .ph{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;
  background:var(--hue,var(--grass));display:block}
.gal .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
/* a carrier mark, not a photograph: white card, logo contained, never cropped */
.gal .ph.mark{background:#fff;display:flex;align-items:center;justify-content:center;padding:9px}
.gal .ph.mark img{width:auto;height:auto;max-width:86%;max-height:62%;object-fit:contain}
.gal figcaption{font-family:var(--font);font-size:10px;line-height:1.3;color:var(--light);
  margin-top:5px;display:block}
.gal figcaption b{font-weight:600;color:var(--mid);display:block;font-family:var(--font)}
/* the opened card shows the square's OWN photo — no extra artwork to source */
.layer-pic{position:relative;overflow:hidden;background:var(--hue,var(--grass));min-height:0;height:100%}
.layer-pic img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;display:block}
.layer-body{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.layer-logo{display:flex;align-items:center;justify-content:center;background:#fff;
  padding:26px 18px;border-bottom:1px solid var(--border-l);flex:none}
.layer-logo img{width:58%;max-width:280px;height:auto;display:block}
.layer-body>.layer-hd{flex:none}
.layer-hd{display:flex;align-items:flex-start;gap:12px;padding:15px 17px 11px;border-bottom:1px solid var(--border-l)}
.layer-hd .lk{font-family:var(--font);font-weight:600;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--light);display:block}
.layer-hd h2{font-family:var(--disp);font-size:24px;line-height:1.05;text-transform:uppercase;color:var(--ink)}
.layer-hd p{font-family:var(--font);font-size:11.5px;color:var(--mid);margin-top:4px;line-height:1.45}
.close{margin-left:auto;flex:none;background:none;border:1px solid var(--border);border-radius:2px;
  font-family:var(--font);font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);padding:6px 10px;cursor:pointer}
.close:hover{border-color:var(--orange);color:var(--orange)}
.subs{flex:1;display:grid;gap:1px;background:var(--card);overflow:auto;align-content:start}
.subs.g1{grid-template-columns:1fr}.subs.g2{grid-template-columns:1fr 1fr}
.sub-i{background:var(--card);box-shadow:0 0 0 1px var(--border-l);padding:12px 15px;display:flex;flex-direction:column;justify-content:center;gap:3px;text-decoration:none}
.sub-i:hover{background:#fff}
.sub-i .sc{font-family:var(--font);font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.sub-i .st{font-family:var(--disp);font-size:15px;text-transform:uppercase;color:var(--ink)}
.sub-i .st.amt{font-size:22px}
.sub-i .sd{font-family:var(--font);font-size:11px;color:var(--mid);line-height:1.4}

/* ── OhBear token + the roll control ── */
.token{position:absolute;left:0;top:0;width:var(--tk,34px);height:auto;z-index:20;
  pointer-events:none;filter:drop-shadow(0 3px 6px rgba(28,20,10,.42));
  transition:transform .26s cubic-bezier(.34,1.3,.5,1);will-change:transform}
.roll{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  background:var(--ink);color:var(--paper);border:none;border-radius:3px;
  padding:9px 14px 9px 10px;font-family:var(--disp);font-size:14px;letter-spacing:.06em;
  text-transform:uppercase}
.roll:hover{background:#2a2219}
.roll:disabled{opacity:.55;cursor:default}
.roll .die{width:26px;height:26px;background:var(--paper);border-radius:4px;flex:none;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:2px;padding:4px}
.roll.rolling .die{animation:shake .32s linear infinite}
@keyframes shake{0%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}100%{transform:rotate(-9deg)}}
.roll .die i{border-radius:50%;background:var(--ink);opacity:0}
.roll .die i.on{opacity:1}
.roll-again{margin-left:auto;flex:none;background:var(--ink);color:var(--paper);border:none;
  border-radius:2px;font-family:var(--font);font-weight:600;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:6px 10px;cursor:pointer}
.roll-again:hover{background:#2a2219}
.layer-hd .close{margin-left:8px}
/* ── 排排站: the same content, standing in a row ── */
.stack{padding:8px 0 0}
.sec{padding:40px 0 8px;scroll-margin-top:64px}
.sechd{margin-bottom:20px;max-width:720px}
.sechd h2{font-family:var(--disp);font-size:clamp(24px,3.6vw,40px);color:var(--ink);line-height:1.05}
.sechd .sub{font-family:var(--disp);font-size:clamp(16px,2vw,22px);color:var(--orange);
  line-height:1.15;margin-top:2px}
.sechd .note{display:block;font-size:13px;color:var(--mid);margin-top:9px;line-height:1.55}
/* numbered offer rows, as the live site has them */
.offer{display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:start;
  padding:20px 0;border-top:1px solid var(--border)}
.offer:last-child{border-bottom:1px solid var(--border)}
.offer .no{font-family:var(--disp);font-size:40px;line-height:.85;color:var(--orange)}
.offer h3{font-family:var(--disp);font-size:22px;text-transform:uppercase;color:var(--ink);line-height:1.1}
.offer p{font-size:13px;color:var(--mid);line-height:1.6;margin-top:6px;max-width:62ch}
.offer .cta{display:inline-block;margin-top:9px;font-family:var(--font);font-weight:700;
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--orange);text-decoration:none}
.offer .cta:hover{text-decoration:underline}
.offer .shot{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;
  background:var(--hue,var(--grass));margin-top:12px;max-width:320px}
.offer .tag{display:inline-block;background:var(--mango);color:var(--ink);font-family:var(--disp);
  font-size:11px;padding:2px 7px;border-radius:2px;margin-left:8px;vertical-align:3px}
.cards{display:grid;gap:10px}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.c2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--border-l);border-radius:3px;overflow:hidden;
  display:flex;flex-direction:column;text-decoration:none}
.card:hover{border-color:var(--orange)}
.card .top{background:#fff;padding:20px 18px;display:flex;align-items:center;justify-content:center;
  min-height:96px;border-bottom:1px solid var(--border-l)}
.card .top img{max-width:78%;max-height:52px;object-fit:contain}
.card .shot{display:block;aspect-ratio:16/9;width:100%;object-fit:cover;display:block;background:var(--hue,var(--grass))}
.card .bd{padding:15px 17px 17px;flex:1;display:flex;flex-direction:column;gap:5px}
.card .n{font-family:var(--disp);font-size:13px;letter-spacing:.14em;color:var(--orange)}
.card h3{font-family:var(--disp);font-size:19px;text-transform:uppercase;color:var(--ink);line-height:1.1}
.card p{font-size:12.5px;color:var(--mid);line-height:1.5;flex:1}
.card .go{font-family:var(--font);font-weight:600;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--orange);margin-top:4px}
.card .tag{align-self:flex-start;background:var(--mango);color:var(--ink);font-family:var(--disp);
  font-size:11px;letter-spacing:.04em;padding:2px 7px;border-radius:2px}
.win{background:var(--ink);color:var(--paper);border-radius:3px;padding:34px 30px;text-align:center;margin-top:8px}
.win h2{font-family:var(--disp);font-size:clamp(26px,4vw,44px);text-transform:uppercase;line-height:1.02}
.win p{font-size:13px;color:#b9ab94;margin:9px auto 0;max-width:54ch}
.list-sec{padding:30px 0 52px}
.rule{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.rule h2{font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--light)}
.rule span{flex:1;border-bottom:1px solid var(--border)}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:6px}
.row{border:1px solid var(--border-l);border-radius:3px;padding:9px 11px;text-decoration:none;display:block}
.row:hover{border-color:var(--orange)}
.row .k{display:block;font-family:var(--font);font-weight:600;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--light)}
.row .n{display:block;font-family:var(--disp);font-size:13px;text-transform:uppercase;color:var(--mid);margin-top:2px}

.anno{background:#1d1710;color:#cdbfa6;font-family:var(--font);font-size:11.5px;line-height:1.6;padding:14px 0}
.anno .wrap{display:flex;gap:10px;align-items:flex-start}
.anno b{color:var(--mango);font-family:var(--disp);letter-spacing:.09em;font-size:12px;text-transform:uppercase;white-space:nowrap}

@media (max-width:1000px){
  .c4{grid-template-columns:repeat(2,1fr)}
}
/* Narrow desktops: the middle still has two columns, but the artwork and
   the type both have to give or the taglines wrap onto two lines. */
@media (max-width:1180px) and (min-width:861px){
  .pane{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);padding:18px 18px}
  .lines b{font-size:12.5px;letter-spacing:.05em}
  .lede{font-size:11.5px;max-width:30ch}
    .kick{font-size:9px;letter-spacing:.14em}
  .stage .map{height:70%}
  .stage .bear{height:68%}
}
@media (max-width:860px){
  .c3,.c4,.c2{grid-template-columns:1fr}
  .sec{padding:28px 0 4px}
  :root{--gap:6px}
  .nav{display:none}
  .board-sec{padding:6px 0}
  /* Tiles stay square (sized from WIDTH). The two middle rows absorb any
     leftover height, so a taller box is filled by the centre panel rather
     than left blank. Capped at 1.55x width so the side squares cannot
     stretch absurdly if the box is very tall. */
  /* Height comes from content, never from 100vh. Inside an iframe, vh is
     the iframe's own height, so a vh-based board feeds its height back into
     the host that is sizing it and the pair locks at the starting value. */
  .board{grid-template-columns:repeat(4,1fr);
         --row:calc((100vw - 28px)/4);
         grid-template-rows:var(--row) minmax(150px,auto) minmax(150px,auto) var(--row);
         margin:0 auto}

  .centre{grid-area:2/2/4/4;min-height:0}
  .p1{grid-area:1/1}.p2{grid-area:1/2}.p3{grid-area:1/3}.p4{grid-area:1/4}
  .p5{grid-area:2/4}.p6{grid-area:3/4}.p7{grid-area:4/4}.p8{grid-area:4/3}
  .p9{grid-area:4/2}.p10{grid-area:4/1}.p11{grid-area:3/1}.p12{grid-area:2/1}
  /* size to content, centred in the middle band — a one-item layer
     should not become a tall empty panel */
  .pane.layer{grid-area:2/1/4/5;min-height:0;align-self:center;
         height:max-content;max-height:100%;box-shadow:0 8px 28px rgba(28,20,10,.28);
         grid-template-columns:1fr;grid-template-rows:auto auto}
  /* stacked: photo strip on top, text under. height:100% from the desktop
     rule has to be undone or aspect-ratio never applies */
  .layer-pic{aspect-ratio:16/9;width:100%;height:auto}
  .token{--tk:22px}
  .roll{font-size:11px;padding:6px 10px 6px 7px;gap:6px}
  .roll .die{width:19px;height:19px;padding:3px;gap:1.5px}
  .pane{padding:10px 9px;gap:7px;grid-template-columns:1fr;
        grid-template-rows:auto auto;text-align:center;justify-items:center}
  .stage{height:96px;width:100%}
  .stage .map{height:86%;left:2%}
  .stage .bear{height:76%;left:38%}
  .dice{width:24%;height:42%;right:0;top:0}
  .words{align-items:center;gap:5px}
  .roll{align-self:center}
  .pane h1{font-size:clamp(17px,6vw,26px)}
  .lede{font-size:10.5px;max-width:28ch}
  /* on a phone the taglines earn their space; the four-line
     regional kicker does not */
  .kick{display:none}
    .lines b{font-size:12px;letter-spacing:.06em}
  .tile .bar{height:4px}
  .tile .cap{padding:8px 5px 5px;overflow:hidden}
  /* TILES.md sized 9px against KAOHSIUNG (9 chars); DADAOCHENG is 10 and
     overran, so drop a notch and clip rather than let it bleed */
  .tile h3{font-size:clamp(9.5px,2.3vw,17px);letter-spacing:-.01em;line-height:1.1;
           overflow:hidden;overflow-wrap:normal;hyphens:none}
  /* Content stays. At 768-860px a square is 180-204px — as big as desktop —
     so there is nothing to hide. Type scales with the viewport; the genuinely
     cramped sizes are handled in the <=560px block below. */
  .tile .kind{font-size:clamp(7px,1.35vw,9.5px);letter-spacing:.12em;margin-bottom:2px}
  .tile .sub{font-size:clamp(8px,1.7vw,12px);line-height:1.3;margin-top:2px}
  .tile .flag{font-size:clamp(7.5px,1.5vw,10px);padding:3px 6px}
  .tile .num{font-size:clamp(7px,1.2vw,9px)}
  .tile .layers{display:none}
  .tile .scrim{height:64%}
  /* a fare condition cannot be read in 76px — it lives in the layer instead */
  .tile.air{padding:8px}
  .tile.air img{max-width:100%}
  .tile.air .cond{font-size:clamp(7px,1.3vw,9.5px);padding:4px 5px}
  /* left-align like every other square, so the label stops before the
     bottom-right corner where the token rests */
  .tile.start{padding:7px 5px;gap:1px;align-items:flex-start;
              justify-content:flex-end;text-align:left}
  .tile.start .cap{align-items:flex-start}
  .tile.start .big{font-size:11px}
  .tile.start .plane{width:58%;margin:1px 0}
  /* "TPE Airport" is 74px wide in a 76px square — it fills the row, so no
     token position clears it. START! plus the plane carries the meaning at
     this size; the full name is in the card. */
  .tile.start h3{font-size:clamp(7px,1.5vw,12px)}
  .tile.start .plane{width:66%;margin:2px 0 0}

  .subs.g3{grid-template-columns:1fr 1fr 1fr}
  .sub-i .mk{min-height:0;padding:5px 6px;margin-bottom:4px}
  .sub-i .mk img{max-height:18px}
  .layer-hd{padding:9px 10px 7px;gap:7px}
  .layer-hd h2{font-size:clamp(15px,2.6vw,22px)}
  .layer-hd .lk{font-size:clamp(8px,1.3vw,9px)}
  .layer-hd p{font-size:clamp(10.5px,1.6vw,12px);margin-top:3px}
  /* the manifesto card. Squares here are 180-204px, so the card is wide:
     the paragraph and all three captions stay, only the scale changes. */
  .man-wrap{padding:11px 13px 13px;gap:9px}
  .man-lead{font-size:clamp(13.5px,2.15vw,18px)}
  .man{font-size:clamp(11.5px,1.7vw,13px);line-height:1.5}
  .man-cta{font-size:clamp(10px,1.4vw,11px)}
  .gal{gap:7px}
  .gal figcaption{font-size:clamp(8.5px,1.25vw,10px);margin-top:4px}
  .close{padding:4px 7px;font-size:9px}
  .layer-logo{padding:16px 14px} .layer-logo img{width:52%;max-width:190px}
  .sub-i{padding:9px 11px} .sub-i .st{font-size:clamp(11px,1.9vw,15px)}
  .sub-i .st.amt{font-size:clamp(15px,2.6vw,21px)}
  .sub-i .sc{font-size:clamp(8px,1.3vw,9.5px)}
  .sub-i .sd{font-size:clamp(9.5px,1.5vw,11px);line-height:1.35}
}
/* Below 560px a square is under ~128px. Only here is there really not
   enough room, and even then the offer badge stays — it is the point. */
@media (max-width:560px){
  .tile .kind{display:none}
  .tile .sub{display:none}
  .tile .num{display:none}
  .tile h3{font-size:9.5px}
  .tile .flag{font-size:7px;padding:2px 4px;top:5px;right:4px}
  .tile.start h3{display:none}
  .tile.air .cond{display:none}
  .layer-hd .lk{display:none}
  /* captions name the places, so they stay even here */
  .man-wrap{padding:9px 10px 11px;gap:7px}
  .man-lead{font-size:13px}
  .man{font-size:11.5px;line-height:1.45}
  .gal{gap:5px}
  .gal figcaption{font-size:8.5px;margin-top:3px}
  .sub-i .sd{font-size:9.5px}
}

</style>
</head>
<body>
<section class="board-sec"><div class="wrap">
  <div class="board" id="board">
    <div class="centre"><div class="pane" id="manifesto"></div></div>
    <img class="token" id="token" alt="" aria-hidden="true"
         src="img/token.png">
    <div class="pane layer" id="layer" hidden></div>
  </div>
</div></section>

<!-- Bump ?v= whenever you edit content.js, or browsers keep serving the
     old copy and your change appears to do nothing. A hard refresh
     (Cmd+Shift+R) also works. -->
<script src="content.js?v=9"></script>
<script>
const board=document.getElementById('board'),layer=document.getElementById('layer'),
      rowsEl=null;
// the middle of the board, from CENTRE in content.js
const TAIWAN_SVG =
  '<svg class="map" viewBox="43.5 21.8 152.0 211.8" fill="currentColor" aria-hidden="true">'
  + '<path d="M168.50,23.75 171.25,24.00 179.25,31.75 188.25,35.25 193.50,42.50 188.00,48.00 184.75,55.00 184.50,60.25 186.25,67.25 185.75,74.25 177.50,90.50 173.75,95.75 172.75,99.50 172.75,103.75 171.50,106.75 171.75,112.25 167.75,125.25 167.75,127.50 166.50,130.00 163.75,141.75 159.75,154.00 153.75,166.50 136.50,190.50 132.50,198.50 129.75,208.25 129.50,214.75 127.25,228.00 127.50,231.00 126.75,231.50 122.50,229.00 119.50,230.50 118.00,229.00 118.00,216.25 115.00,208.25 108.25,200.50 98.25,195.50 96.25,193.25 92.00,185.25 87.00,168.25 83.50,163.00 79.50,159.25 81.00,155.50 81.25,149.50 85.00,142.50 86.00,139.25 86.00,136.50 84.25,133.00 85.25,131.00 87.75,119.50 87.50,116.25 88.75,114.25 93.75,112.75 94.50,106.00 98.00,102.50 100.25,97.00 103.00,94.25 103.00,92.75 107.25,85.75 108.25,81.75 111.75,79.75 114.00,77.50 118.25,68.50 120.00,66.25 128.00,60.00 129.75,57.75 131.25,54.75 132.00,50.50 135.00,46.25 134.75,44.25 136.50,40.50 141.25,38.00 145.25,37.00 152.00,34.00 159.75,32.50 162.25,27.75 166.75,24.25 168.50,23.75Z"/><path d="M166.00,220.25 167.50,220.25 169.75,222.50 170.50,224.50 170.00,225.50 168.25,225.50 166.00,223.75 165.50,223.00 166.00,220.25Z"/><path d="M52.75,126.50 55.00,127.50 55.75,129.25 53.00,131.50 51.50,131.50 50.50,129.75 52.75,126.50Z"/><path d="M46.50,140.25 49.25,140.50 49.50,142.00 48.50,143.25 46.00,143.00 46.50,140.25Z"/><path d="M46.75,123.50 48.00,124.50 48.00,126.50 47.25,127.75 46.00,127.75 45.50,126.25 46.75,123.50Z"/><path d="M51.50,120.25 53.50,121.75 52.25,123.50 50.00,122.75 50.00,121.50 51.50,120.25Z"/><path d="M163.25,184.00 165.25,184.75 165.25,185.50 163.50,187.00 162.25,186.00 162.25,184.50 163.25,184.00Z"/></svg>';
document.getElementById('manifesto').innerHTML =
  `<div class="stage">${TAIWAN_SVG}
     <img class="bear" src="img/bear.webp" alt="">
     <span class="dice" id="dice3d">
       <img class="cube a" src="img/die-orange.webp" alt="">
       <img class="cube b" src="img/die-cream.webp" alt=""></span></div>
   <div class="words">
     <h1>${CENTRE.title[0]} <em>${CENTRE.title[1]}</em></h1>
     <span class="lede">${CENTRE.lede}</span>
     <span class="lines">${CENTRE.lines.map(l=>`<b>${l}</b>`).join('')}</span>
     <button class="roll" id="roll">
       <span class="die" id="die" aria-hidden="true"></span>${CENTRE.button}</button>
   </div>`;
const brandEl=document.getElementById('brand'); if(brandEl) brandEl.textContent=M.brand;


/* colour code, driven by the square's `kind` in content.js */
function accentFor(d){
  if(d.cls==='start') return 'k-start';
  const k=(d.kind||'').toLowerCase();
  if(k.includes('promo')) return 'k-promo';
  if(k.includes("what")) return 'k-now';
  if(k.includes('ways'))  return 'k-ways';
  return 'k-ways';
}
const PLANE = '<svg class="plane" viewBox="0 0 120 46" fill="none" aria-hidden="true"><path d="M4 30.5 L30 24 L18 10 h7.5 l17 12 L66 16.5 c6-1.6 10.5-1.2 11.6 1.2 1.1 2.4-1.6 5.2-7.3 7.2 L44 30.6 l-13 15.3 h-7.6 L30 31.9 L4 34.6 Z" fill="#fff"/><path d="M84 22 h24 M100 14 l10 8 -10 8" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

TILES.forEach((d,i)=>{
  const b=document.createElement('button');
  b.className='tile p'+(i+1)+(d.cls?' '+d.cls:'')+' '+accentFor(d);
  if(d.hue) b.style.setProperty('--hue',d.hue);
  b.setAttribute('aria-expanded','false');
  const n=String(i+1).padStart(2,'0');
  b.innerHTML = d.cls==='start'
    ? `<span class="bar"></span><span class="num">${n}</span>
       <span class="cap"><span class="big">START!</span>
         ${PLANE}
         <h3>TPE Airport</h3></span>`
    : d.cls==='air'
    ? `<span class="num">${n}</span><img src="${LOGO}${d.logo}.png" alt="${d.t}">
       <span class="layers"><i></i></span><span class="cond">${d.cond}</span>`
    : `<span class="ph"></span>`
      + (d.photo?`<img class="pic" src="photos/${d.photo}.webp" alt="" onerror="this.remove()">`:'')
      +`<span class="scrim"></span><span class="bar"></span><span class="num">${n}</span>`
      +(d.flag?`<span class="flag">${d.flag}</span>`:'')
      +`<span class="layers">${'<i></i>'.repeat(Math.min((d.gal||[]).length,4))}</span>`
      +`<span class="cap"><span class="kind">${d.kind}</span><h3>${d.t}</h3>`
      +`<span class="sub">${d.s}</span></span>`;
  b.addEventListener('click',()=>open(d,b));
  board.appendChild(b);

});
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let cur=null;
function open(d,btn){
  if(cur===btn){close();return;}
  if(cur)cur.setAttribute('aria-expanded','false');
  cur=btn; btn.setAttribute('aria-expanded','true');
  const hue=d.hue||'#007758';

  // three pictures. A missing file removes its own <img> and leaves the
  // square's colour behind it, so an unshot card still looks deliberate.
  const gal=(d.gal||[]).map(g=>{
    const inner = g.logo
      ? `<span class="ph mark"><img src="${LOGO}${g.logo}.png" alt="" onerror="this.remove()"></span>`
      : `<span class="ph"><img src="photos/cards/${g.i}.webp" alt="" onerror="this.remove()"></span>`;
    const cap = g.c ? `<figcaption>${g.sub?`<b>${g.c}</b>${g.sub}`:g.c}</figcaption>` : '';
    return `<figure>${inner}${cap}</figure>`;
  }).join('');

  const cta = d.cta ? `<a class="man-cta" href="${d.cta.u}">${d.cta.t} \u2192</a>` : '';

  layer.innerHTML=`<div class="layer-hd">
      <div><span class="lk">${d.kind||''}</span><h2>${d.t}</h2></div>
      <button class="roll-again" id="ra">Roll again</button>
      <button class="close" id="cl">Close \u00d7</button></div>
    <div class="man-wrap" style="--hue:${hue}">
      <p class="man-lead">${d.s||''}</p>
      <p class="man">${d.body||''}</p>
      ${cta}
      <div class="gal">${gal}</div>
    </div>`;
  layer.hidden=false;
  document.getElementById('cl').addEventListener('click',close);
  const ra=document.getElementById('ra'); if(ra) ra.addEventListener('click',roll);
}
function close(){layer.hidden=true; if(cur)cur.setAttribute('aria-expanded','false'); cur=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});

/* ── deep link ────────────────────────────────────────────────
   ?open=<slug> lands with that square already turned, so an ad can point at
   one offer instead of the homepage. Keeps the board visible behind it, so
   the visitor still sees there is more under the rest.            */
(function deepLink(){
  const want=new URLSearchParams(location.search).get('open');
  if(!want)return;
  const i=TILES.findIndex(t=>slug(t.t)===want.toLowerCase());
  if(i<0)return;
  const btn=[...board.querySelectorAll('.tile')][i];
  open(TILES[i],btn);
  at=i; placeToken(i,false);
  btn.scrollIntoView({block:'center'});
})();

/* ── Surprise me ──────────────────────────────────────────────
   A visitor can always just click. This is the other door: roll, and the
   token walks that many squares round the board and opens where it lands.
   Carriers are stepped over — "your surprise is: China Airlines" is not a
   discovery. Flip STOP_ON_CARRIERS to let it land on them.            */
const STOP_ON_CARRIERS=false;
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const token=document.getElementById('token'),rollBtn=document.getElementById('roll'),
      dieEl=document.getElementById('die');
const squares=()=>[...board.querySelectorAll('.tile')];
let at=0, rolling=false;

function drawDie(n){
  dieEl.innerHTML='';
  const on=new Set(PIPS[n]||[]);
  for(let i=0;i<9;i++){const d=document.createElement('i');
    if(on.has(i))d.className='on'; dieEl.appendChild(d);}
}
function placeToken(i,animate=true){
  const t=squares()[i]; if(!t)return;
  if(!animate) token.style.transition='none';
  const w=token.offsetWidth||34, h=token.offsetHeight||56;
  // bottom-RIGHT of the square, not centred: labels sit bottom-left, and a
  // centred piece lands on top of them once a square is only 76px wide
  token.style.transform=`translate(${t.offsetLeft+t.offsetWidth-w-4}px,`
    +`${t.offsetTop+t.offsetHeight-h-4}px)`;
  if(!animate) requestAnimationFrame(()=>token.style.transition='');
}
function step(){ at=(at+1)%squares().length; placeToken(at); }

function roll(){
  if(rolling)return; rolling=true;
  rollBtn.disabled=true; rollBtn.classList.add('rolling'); close();
  const d3=document.getElementById('dice3d');
  if(d3){ d3.classList.remove('tumble'); void d3.offsetWidth; d3.classList.add('tumble'); }
  let flick=0;
  const spin=setInterval(()=>{drawDie(1+Math.floor(Math.random()*6)); flick++;},80);
  setTimeout(()=>{
    clearInterval(spin);
    const n=1+Math.floor(Math.random()*6); drawDie(n);
    let moved=0;
    const walk=setInterval(()=>{
      step(); moved++;
      if(moved>=n){
        // never rest on a carrier unless asked to
        if(!STOP_ON_CARRIERS && TILES[at].cls==='air'){ return; }
        clearInterval(walk);
        setTimeout(()=>{
          const btn=squares()[at]; open(TILES[at],btn);
          rolling=false; rollBtn.disabled=false; rollBtn.classList.remove('rolling');
          if(d3) d3.classList.remove('tumble');
        },240);
      }
    },190);
  },560);
}
rollBtn.addEventListener('click',roll);
drawDie(6);
placeToken(0,false);
addEventListener('resize',()=>placeToken(at,false));
requestAnimationFrame(()=>placeToken(0,false));

/* ── optional: tell the host how tall we actually want to be ──────────
   Works with no host code at all — the layout above already fills whatever
   height it is given, so there is never a blank band. But if you add six
   lines of Velo on the Wix page, the element will match the content exactly
   and you stop guessing heights per breakpoint:

     $w.onReady(() => {
       $w('#html1').onMessage(e => {
         if (e.data && e.data.boardHeight) $w('#html1').height = e.data.boardHeight;
       });
     });
*/
function wanted(){
  const b=document.querySelector('.board');
  return Math.ceil(b.getBoundingClientRect().height + 20);
}
function report(){
  const h=wanted();
  try{ parent.postMessage({boardHeight:h},'*'); }catch(e){}
}
addEventListener('load',report);
addEventListener('resize',report);
new ResizeObserver(report).observe(document.querySelector('.board'));
</script>
</body>
</html>
